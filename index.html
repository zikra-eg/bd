<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حفلة مريم 3D 🎂</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
:root{--ink:#3b1f8f;--pink:#ff5fa2;--sun:#ffd23f;--sky:#3fb6ff;--card:#fff;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fff3c4;--card:#2c1d57;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#fff3c4;--card:#2c1d57;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#ffd6ea;color:var(--ink);font-family:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;font-weight:500;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.btn{font:inherit;font-weight:800;font-size:1.25rem;color:#fff;background:var(--pink);border:0;border-radius:999px;padding:13px 28px;box-shadow:0 7px 0 #c93a7c;cursor:pointer}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 #c93a7c}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#hint{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 18px;font-weight:800;font-size:1rem;box-shadow:0 5px 0 rgba(0,0,0,.18);max-width:92vw;text-align:center;display:none}
#pad{position:fixed;left:22px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.45);border:4px solid var(--card);display:none;touch-action:none}
#kn{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:var(--pink);box-shadow:0 5px 0 #c93a7c}
#blow{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;animation:pu .8s ease-in-out infinite alternate;white-space:nowrap}
@keyframes pu{to{transform:translateX(-50%) scale(1.08)}}
.mute{position:fixed;right:14px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:0;background:var(--sky);color:#fff;font-size:1.4rem;box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer;display:none}
#intro,#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;z-index:10}
#intro{background:linear-gradient(#ffd6ea,#d9c8ff)}
.box{background:var(--card);color:var(--ink);border-radius:28px;padding:24px 20px;max-width:400px;box-shadow:0 18px 40px rgba(0,0,0,.25);border:4px dashed var(--sun);line-height:1.8;font-size:1.15rem}
.box h1{margin:0 0 6px;font-size:2.1rem;font-weight:800;color:var(--pink)}
#msg{display:none;background:rgba(255,230,244,.55);backdrop-filter:blur(6px);opacity:0;transition:opacity 1.8s ease}
#msg.on{opacity:1}
#msg .box{background:linear-gradient(160deg,#fff,#ffeaf5);color:#6b2a63;border:3px solid #ffc4e0;font-size:1.3rem;line-height:2;transform:translateY(24px);transition:transform 2.2s ease}
#msg.on .box{transform:none}
.pt{position:absolute;top:-10%;font-size:1.6rem;animation:fall 9s linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(260deg)}}
@media (prefers-reduced-motion:reduce){#blow,.pt{animation:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hint"></div>
<div id="pad" aria-label="عصا التحكم"><div id="kn"></div></div>
<button class="btn" id="blow">اطفي الشمع 🕯️</button>
<button class="mute" id="mute" aria-label="تشغيل أو إيقاف الصوت">🔊</button>
<div id="intro"><div class="box"><h1>حفلة مريم 🎉</h1>حركي الشخصية بالعصا اللي تحت (أو الأسهم / WASD)<br>وروحي للدايرة المنورة قدام التورتة ✨<br><br><button class="btn" id="go">ادخلي الحفلة 🚪</button></div></div>
<div id="msg"><span class="pt" style="left:8%;animation-delay:0s">🌸</span><span class="pt" style="left:28%;animation-delay:3s">💖</span><span class="pt" style="left:52%;animation-delay:1.5s">🌸</span><span class="pt" style="left:74%;animation-delay:4.5s">💗</span><span class="pt" style="left:90%;animation-delay:2s">🌸</span>
<div class="box">يا مريم 🌸<br>كل سنة وانتي أحلى حاجة في حياتنا.<br>ضحكتك بتنوّر المكان، وأمنيتنا إن السنة الجاية تبقى مليانة فرحة وأحلام حلوة بتتحقق واحدة ورا التانية.<br>بنحبك أوي 💖<br><button class="btn" id="cl" style="margin-top:10px;font-size:1.1rem">كمّلي الحفلة 🎈</button></div></div>
